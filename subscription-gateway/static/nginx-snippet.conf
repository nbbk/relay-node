# 静态托管 nginx 片段（选项 D 自建静态时用）
#
# 只解决 /client-config.json 这一条路：把签好的文件放固定目录，nginx 原样 served。
# 订阅（/sub/*）与公告（/api/v1/public-info）仍要走选项 A/B/C 的反代，静态托管管不了。

location = /client-config.json {
    # 改成你放签好文件的实际路径
    alias /var/www/sub-gateway/client-config.json;

    # 字节精确：不要压缩、不要缓存。
    # 说明：客户端验签验的是解压后的字节，gzip 本来也不影响验签；
    # 这里关掉 gzip、禁缓存，纯粹是求稳——文件换了立即生效，不会被中间层缓存旧版。
    gzip off;
    expires -1;
    add_header Cache-Control "no-store";
    add_header Content-Type application/json;
}
